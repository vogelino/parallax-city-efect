<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>3D Card Following Cursor</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="parallax-experience" aria-label="Parallax city scene">
      <button class="tilt-permission" type="button" hidden>Enable tilt</button>
      <div class="parallax">
        <div class="layer scene-layer" data-scene-layer="0">
          <div class="layer-scroll scene-strip">
            <img class="layer-tile" src="/images/layer_0.webp" alt="" />
          </div>
        </div>
        <div class="layer scene-layer clouds" data-scene-layer="1">
          <div class="layer-scroll scene-strip">
            <img class="layer-tile" src="/images/layer_1.webp" alt="" />
          </div>
        </div>
        <div class="layer scene-layer" data-scene-layer="2">
          <div class="layer-scroll scene-strip">
            <img class="layer-tile" src="/images/layer_2.webp" alt="" />
          </div>
        </div>
        <div class="layer scene-layer" data-scene-layer="3">
          <div class="layer-scroll scene-strip">
            <img class="layer-tile" src="/images/layer_3.webp" alt="" />
          </div>
        </div>

        <div class="layer scene-layer" data-scene-layer="4">
          <div class="layer-scroll scene-strip">
            <img class="layer-tile" src="/images/layer_4.webp" alt="" />
          </div>
        </div>
        <div class="layer scene-layer" data-scene-layer="5">
          <div class="layer-scroll scene-strip">
            <img class="layer-tile" src="/images/layer_5.webp" alt="" />
          </div>
        </div>
        <div class="layer scene-layer" data-scene-layer="6">
          <div class="layer-scroll scene-strip">
            <img class="layer-tile" src="/images/layer_6.webp" alt="" />
          </div>
        </div>
        <div class="layer fog">
          <div class="layer-scroll">
            <div class="fog-container">
              <img src="/images/fog.webp" alt="" />
              <img src="/images/fog.webp" alt="" />
            </div>
          </div>
        </div>
        <div class="layer birds">
          <div class="layer-scroll">
            <div class="birds-container">
              <img src="/images/bird-large-right.svg" alt="" />
              <img src="/images/bird-lower-left.svg" alt="" />
              <img src="/images/bird-small-top.svg" alt="" />
            </div>
          </div>
        </div>
        <div class="layer scene-layer" data-scene-layer="7">
          <div class="layer-scroll scene-strip">
            <img class="layer-tile" src="/images/layer_7.webp" alt="" />
          </div>
        </div>
      </div>
    </section>
    <script src="./index.ts" type="module"></script>
  </body>
</html>
